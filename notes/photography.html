<style>
img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 1.5rem auto;
    border-radius: 0.5rem;
}

.image-container {
    width: 100%;
}

/* Standard thumbnail state */
.gallery-img {
  cursor: pointer;
  transition: transform 0.3s ease, all 0.3s ease;
  max-width: 100%;
  z-index: 1;
}

/* Expanded state */
.gallery-img.zoomed {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  max-width: 90vw;
  max-height: 90vh;
  z-index: 1000;
  box-shadow: 0 0 50px rgba(0,0,0,0.8);
}

/* Optional: Dim the background when zoomed */
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 999;
}

.overlay.active { display: block; }
</style>
